services:
  redis:
    image: redis:alpine
    container_name: opex-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: always

  minio:
    image: minio/minio
    container_name: opex-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    restart: always

  postgres:
    image: postgres:15-alpine
    container_name: opex-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: opex_user
      POSTGRES_PASSWORD: opex_password
      POSTGRES_DB: opex_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

volumes:
  redis_data:
  minio_data:
  postgres_data:
