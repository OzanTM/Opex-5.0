groups:
  - name: opex-availability
    rules:
      - alert: OpexFrontendDown
        expr: probe_success{job="blackbox_frontend"} == 0
        for: 2m
        labels:
          severity: critical
          service: frontend
        annotations:
          summary: "Frontend endpoint not reachable"
          description: "Frontend probe failed for 2 minutes."

      - alert: OpexBackendHealthDown
        expr: probe_success{job="blackbox_backend_health"} == 0
        for: 2m
        labels:
          severity: critical
          service: backend
        annotations:
          summary: "Backend health endpoint not reachable"
          description: "Backend /api/v1/health probe failed for 2 minutes."

  - name: opex-latency
    rules:
      - alert: OpexBackendHealthSlow
        expr: probe_duration_seconds{job="blackbox_backend_health"} > 1.5
        for: 10m
        labels:
          severity: warning
          service: backend
        annotations:
          summary: "Backend health endpoint latency is high"
          description: "Backend health probe duration is over 1.5s for 10 minutes."
